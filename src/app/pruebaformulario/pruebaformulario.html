<section>
    <h1>Contacto</h1>
    <form action="">
        <label for="nombre">Nombre</label>
        <input type="text" [(ngModel)] = nombre>
        <button type="submit">Enviar</button>
    </form>
</section>


<aside>
    <h3>Vista previa</h3>
    @if(nombre){
        <p>Nombre: {{nombre}}</p>
    }
    @else {
        <p>Sin informacion</p>
    }
    @if (enviado){
        <p>El formulario fue enviado</p>
    }
</aside>
