<section>
  <form>
    <label>Nombre:</label>
    <input type="text" [(ngModel)]="nombre" name="nombre" />

    <button type="button" (click)="enviar()">Enviar</button>
  </form>
</section>

<aside>
  <h3>Vista Previa</h3>

  @if (nombre) {
    <p>Nombre: {{ nombre }}</p>
  } @else {
    <p>Sin informacion</p>
  }

  @if (enviado) {
    <p>El formulario fue enviado</p>
  }
</aside>
