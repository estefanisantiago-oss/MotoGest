
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Conductores</title>
</head>
<body>

    <h1>{{titulo}}</h1>
    <h2>Datos personales</h2>
<section>
    <form>
        <label>Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>
        <br><br>

        <label> Curp: </label>
        <input type="text" id="curp" name="curp" placeholder="Ingrese su curp" required>
        <br><br>

        <label>Correo electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="Ingrese su correo electronico" required>
        <br><br>

        <label>Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Ingrese su numero de telefono" required>
        <br><br>

        <label>Dirección:</label>
        <input type="direction" id="direccion" name="direccion" placeholder="Ingrese su direccion actual" required>
        <br><br>

        <button type="button" (click)="Mostrar=!Mostrar">{{Mostrar ? 'Ocultar' : 'Mostrar'}}</button>
    
       
    </form>
</section>

@if (Mostrar){
    <section class="informacion">
        <p>Hola mundo</p>
    </section>
}

<h2>Datos de conductor</h2>
<section>
    <form>
        <label>Licencia De Conducir:</label>
        <input type="licencia" id="licencia" name="licencia" placeholder="Ingrese su numero de licencia" required>
        <br><br>
        <label>Categoria:</label>
        <input type="categoria" id="categoria" name="categoria" placeholder="Ingrese la categoria de su licencia" required>
        <br><br>
        <label>Fecha De Vencimiento:</label>
        <input type="date" id="vencimiento" name="vencimiento" placeholder="Ingrese la fecha de vencimiento" required>
        <br><br>
        
    </form>
</section>
</body>
</html>
